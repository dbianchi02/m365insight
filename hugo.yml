# Pagination aggiornata per le versioni recenti di Hugo
baseURL: "https://m365insight.dbianchi.it/"
languageCode: "it"
title: "M365 Insight"
theme: "PaperMod"

pagination:
  pagerSize: 10

params:
  defaultTheme: auto
  ShowShareButtons: true
  ShowReadingTime: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowPostNavLinks: true
  ShowToc: true
  ShowRssButtonInSectionTermList: true

  SiteVerificationTag: ""   # <--- FIX OBBLIGATORIO

  # ⭐ PROFILE MODE (in alto nella homepage)
  profileMode:
    enabled: true
    disableContent: false   # <--- permette di vedere ANCHE la homepage personalizzata
    imageUrl: "/images/davide.jpg"
    imageWidth: 180
    imageHeight: 180
    title: "Davide Bianchi"
    subtitle: "Sistemista Microsoft 365 & Azure · Sicurezza · Automazione"
    buttons:
      - name: Articoli
        url: "/posts/"
      - name: Progetti IT
        url: "/progetti/"
      - name: About Me
        url: "/about/"
      - name: Contatti
        url: "/contatti/"

  # ⭐ FOOTER PERSONALIZZATO
  footer:
    enable: true
    customText: "© 2025 Davide Bianchi · M365 Insight"
    socialIcons:
      - name: linkedin
        url: "https://www.linkedin.com/in/davide-bianchi-7b6805257/"
      - name: github
        url: "https://github.com/dbianchi02"

  # ⭐ SEO / Social preview
  env: production
  images: ["/images/banner.png"]

  # SEO avanzata (opzionale ma consigliata)
  analytics:
    google: ""
    bing: ""
    yandex: ""

# ⭐ MENU PRINCIPALE
menu:
  main:
    - identifier: home
      name: Home
      url: /
      weight: 1

    - identifier: posts
      name: Articoli
      url: /posts/
      weight: 2

    - identifier: progetti
      name: Progetti IT
      url: /progetti/
      weight: 3

    - identifier: about
      name: About Me
      url: /about/
      weight: 4

    - identifier: contatti
      name: Contatti
      url: /contatti/
      weight: 5

# Configurazioni di base Hugo / PaperMod
outputs:
  home:
    - HTML
    - RSS
    - JSON