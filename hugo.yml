baseURL: "https://m365insight.dbianchi.it/"
title: "M365 Insight"
theme: "PaperMod"

pagination:
  pagerSize: 10

params:
  defaultTheme: auto
  ShowShareButtons: true
  ShowReadingTime: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowPostNavLinks: true
  ShowToc: true
  analytics:
    google:
      GA4: "G-50R88HRP0S"
    clarity: "upgcyjelsc"

  homeInfoParams: {}

  profileMode:
    enabled: true
    disableContent: false
    imageUrl: "/images/davide.png"
    imageWidth: 180
    imageHeight: 180
    title: "Davide Bianchi"
    subtitle: "Sistemista Microsoft 365 & Azure · Sicurezza · Automazione"
    buttons:
      - name: Articoli
        url: "/posts/"
      # Modifica l'URL in /about/ per allinearlo alla tua cartella content/about/
      - name: Chi sono
        url: "/about/" 
      # Modifica l'URL in /contatti/ per allinearlo alla tua cartella content/contatti/
      - name: Contattami
        url: "/contatti/" 

  footer:
    enable: true
    customText: "© 2025 Davide Bianchi · M365 Insight"
    socialIcons:
      - name: linkedin
        url: "https://www.linkedin.com/in/davide-bianchi-7b6805257/?lipi=urn%3Ali%3Apage%3Ad_flagship3_profile_view_base_contact_details%3BEYq8URFsTeyd5GftbHN3Iw%3D%3D"
      - name: github
        url: "https://github.com/dbianchi02"

menu:
  main:
    - identifier: home
      name: Home
      url: /
      weight: 1

    - identifier: posts
      name: News & Post
      url: /posts/
      weight: 2

    # Allineato alla cartella content/about/
    - identifier: about
      name: About Me
      url: /about/
      weight: 4

    # Allineato alla cartella content/contatti/
    - identifier: contact
      name: Contact Me
      url: /contatti/
      weight: 5

resourceDir: "assets"

imaging:
  quality: 75
  resampleFilter: Box

outputs:
  home:
    - HTML
    - RSS
    - JSON
