baseURL: "https://m365insight.dbianchi.it/"
title: "M365 Insight"
theme: "PaperMod"

pagination:
  pagerSize: 10

params:
  defaultTheme: auto
  ShowShareButtons: true
  ShowReadingTime: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowPostNavLinks: true
  ShowToc: true

  homeInfoParams: {}

  profileMode:
    enabled: true
    disableContent: false
    imageUrl: "/images/davide.png"
    imageWidth: 180
    imageHeight: 180
    title: "Davide Bianchi"
    subtitle: "Sistemista Microsoft 365 & Azure · Sicurezza · Automazione"
    buttons:
      - name: Articoli
        url: "/posts/"
      # MODIFICA: Uso il nome "Chi sono" per coerenza
      - name: Chi sono
        url: "/chi-sono/"
      # MODIFICA: Uso il nome "Contattami" per coerenza
      - name: Contattami
        url: "/contatti/"

  footer:
    enable: true
    customText: "© 2025 Davide Bianchi · M365 Insight"
    socialIcons:
      - name: linkedin
        url: "https://www.linkedin.com/in/davide-bianchi-7b6805257/?lipi=urn%3Ali%3Apage%3Ad_flagship3_profile_view_base_contact_details%3BEYq8URFsTeyd5GfttHN3Iw%3D%3D"
      - name: github
        url: "https://github.com/dbianchi02"

menu:
  main:
    - identifier: home
      name: Home
      url: /
      weight: 1

    - identifier: posts
      name: Posts
      url: /posts/
      weight: 2

    # MODIFICA: La pagina che hai creato è 'chi-sono.md', quindi usiamo /chi-sono/
    - identifier: about
      name: About Me
      url: /chi-sono/
      weight: 4

    # MODIFICA: Uso 'Contattami' come nome e url, coerentemente con i button
    - identifier: contact
      name: Contact Me
      url: /contatti/
      weight: 5

resourceDir: "assets"

imaging:
  quality: 75
  resampleFilter: Box