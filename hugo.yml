baseURL: "https://m365insight.dbianchi.it/"
title: "M365 Insight"
theme: "PaperMod"

pagination:
  pagerSize: 10

params:
  defaultTheme: auto
  ShowShareButtons: true
  ShowReadingTime: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowPostNavLinks: true
  ShowToc: true

  profileMode:
    enabled: true
    disableContent: false
    imageUrl: "/images/davide.png"
    imageWidth: 180
    imageHeight: 180
    title: "Davide Bianchi"
    subtitle: "Sistemista Microsoft 365 & Azure · Sicurezza · Automazione"
    buttons:
      - name: Articoli
        url: "/posts/"
      - name: Progetti IT
        url: "/progetti/"
      - name: About Me
        url: "/about/"
      - name: Contact
        url: "/contatti/"

  footer:
    enable: true
    customText: "© 2025 Davide Bianchi · M365 Insight"
    socialIcons:
      - name: linkedin
        url: "https://www.linkedin.com/in/davide-bianchi-cloud/"
      - name: github
        url: "https://github.com/dbianchi02"

menu:
  main:
    - identifier: home
      name: Home
      url: /
      weight: 1

    - identifier: posts
      name: Articoli
      url: /posts/
      weight: 2

    - identifier: progetti
      name: Progetti IT
      url: /progetti/
      weight: 3

    - identifier: about
      name: About Me
      url: /about/
      weight: 4

    - identifier: contact
      name: Contact Me
      url: /contatti/
      weight: 5
